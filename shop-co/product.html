<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product | Shop Co.</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/cart.css" />
    <link rel="stylesheet" href="../css/product.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body class="product-page">
    <div class="offer-bar">
      Sign up and get 20% off to your first order.
      <a href="#newsletter">Sign Up Now</a
      ><button aria-label="Close offer">×</button>
    </div>

    <header class="site-header product-header">
      <a class="brand" href="index.html">SHOP.CO</a>
      <nav class="main-nav product-nav">
        <a href="shop.html">Shop <span>⌄</span></a>
        <a href="#">On Sale</a>
        <a href="#">New Arrivals</a>
        <a href="#">Brands</a>
      </nav>
      <label class="search product-search">
        <span>⌕</span>
        <input type="search" placeholder="Search for products..." />
      </label>
      <div class="header-actions">
        <a href="cart.html" aria-label="Cart"
          >🛒<span id="cart-count">0</span></a
        >
        <a href="#" aria-label="Account">◉</a>
      </div>
    </header>

    <main id="product-detail" class="page product-shell"></main>

    <script src="../js/storage.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/product.js"></script>
  </body>
</html>
